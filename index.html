<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lorraine Wambiru | My portfolio has a new home</title>
    <meta name="description" content="Lorraine Wambiru's portfolio has moved to a new home. Visit lorraine-wambiru.vercel.app for the latest work.">
    <meta name="author" content="Lorraine Wambiru">
    <link rel="canonical" href="https://lorraine-wambiru.vercel.app/">
    <link rel="icon" type="image/png" href="https://lorraine-wambiru.vercel.app/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=Outfit:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --ink: #121113;
            --cream: #F7F7F2;
            --sage: #E4E6C3;
            --moss: #899878;
        }

        html, body { margin: 0; min-height: 100%; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            background: var(--ink);
            color: var(--cream);
            font-family: "Outfit", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 640px;
        }

        .label {
            margin: 0 0 28px;
            font-family: "Space Mono", ui-monospace, monospace;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--moss);
        }

        h1 {
            margin: 0 0 28px;
            font-family: "Fraunces", Georgia, serif;
            font-weight: 300;
            font-size: clamp(2.4rem, 7vw, 4rem);
            line-height: 1.08;
            letter-spacing: -0.02em;
        }

        h1 em {
            font-style: italic;
            color: rgba(137, 152, 120, 0.9);
        }

        p.copy {
            margin: 0 0 44px;
            max-width: 480px;
            font-size: 1.02rem;
            line-height: 1.8;
            color: rgba(228, 230, 195, 0.6);
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 28px;
            border: 1px solid rgba(137, 152, 120, 0.45);
            color: var(--moss);
            text-decoration: none;
            font-family: "Space Mono", ui-monospace, monospace;
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .cta:hover,
        .cta:focus-visible {
            background: var(--moss);
            color: var(--ink);
        }

        .cta:focus-visible {
            outline: 1px solid var(--moss);
            outline-offset: 4px;
        }

        .cta .arrow { transition: transform 0.3s ease; }
        .cta:hover .arrow { transform: translateX(4px); }

        .address {
            margin: 22px 0 0;
            font-family: "Space Mono", ui-monospace, monospace;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            color: rgba(228, 230, 195, 0.35);
        }

        @media (prefers-reduced-motion: reduce) {
            .cta, .cta .arrow { transition: none; }
        }
    </style>
</head>
<body>
    <main>
        <p class="label">Portfolio update</p>
        <h1>My portfolio has found <em>a new home.</em></h1>
        <p class="copy">
            This site has been retired. My work now lives in a redesigned portfolio,
            with new case studies including Solara, Public Pulse and North.
        </p>
        <a class="cta" href="https://lorraine-wambiru.vercel.app/">
            Visit the new portfolio <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
        <p class="address">lorraine-wambiru.vercel.app</p>
    </main>
</body>
</html>
